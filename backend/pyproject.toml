[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gavadr-backend"
version = "0.1.0"
description = "GAVADR water network operations API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "pyproj>=3.7,<4",
  "shapely>=2.0,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
