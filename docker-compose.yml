name: gavadr

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gavadr}
      POSTGRES_USER: ${POSTGRES_USER:-gavadr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD skal angives i .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gavadr} -d ${POSTGRES_DB:-gavadr}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gavadr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gavadr}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY skal angives i .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      ADDRESS_IMPORT_MAX_BYTES: ${ADDRESS_IMPORT_MAX_BYTES:-2097152}
      ADDRESS_IMPORT_MAX_ROWS: ${ADDRESS_IMPORT_MAX_ROWS:-5000}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-GAVAD}
      ORGANIZATION_ADDRESS: ${ORGANIZATION_ADDRESS:-}
      ORGANIZATION_LOCALITY: ${ORGANIZATION_LOCALITY:-}
      MAP_DEFAULT_LONGITUDE: ${MAP_DEFAULT_LONGITUDE:-11.45}
      MAP_DEFAULT_LATITUDE: ${MAP_DEFAULT_LATITUDE:-55.62}
      MAP_DEFAULT_ZOOM: ${MAP_DEFAULT_ZOOM:-13}
      PUBLIC_STATUS_DIR: /data/public-status
      PUBLIC_STATUS_FILENAME: ${PUBLIC_STATUS_FILENAME:-driftsstatus.json}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      BOARD_NOTIFICATION_EMAILS: "${BOARD_NOTIFICATION_EMAILS:-[]}"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - uploads:/data/uploads
      - public_status:/data/public-status
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=$${FORWARDED_ALLOW_IPS}"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - public_status:/data/public-status:ro
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:2026.7.0
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - internal

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["backup"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-gavadr}
      PGUSER: ${POSTGRES_USER:-gavadr}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts/container-backup.sh:/usr/local/bin/container-backup:ro
      - ./backups:/backups
      - uploads:/data/uploads:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/container-backup"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  restore-tools:
    image: alpine:3.22
    profiles: ["operations"]
    volumes:
      - uploads:/data/uploads
    entrypoint: ["/bin/sh"]
    command: ["-c", "echo 'restore-tools is only invoked by scripts/restore.sh' >&2; exit 1"]

volumes:
  postgres_data:
  uploads:
  public_status:

networks:
  internal:
    driver: bridge
